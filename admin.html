<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PinoyCart Admin</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"></head><body><header class="admin-top"><a class="brand" href="/"><span class="brand-mark">P</span><span>Pinoy<span class="orange">Cart</span><small>ADMIN DASHBOARD</small></span></a><a href="/">← View shop</a></header><main class="admin-main"><section id="loginPanel" class="admin-login"><span class="eyebrow">STORE MANAGEMENT</span><h1>Admin login</h1><p>Sign in to view customer orders and manage COD fulfilment.</p><form id="loginForm"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input name="password" required type="password" autocomplete="current-password"></label><button class="primary-button">Sign in</button><p id="loginError" class="error"></p></form></section><section id="dashboard" hidden><div class="admin-heading"><div><span class="eyebrow">OVERVIEW</span><h1>Orders dashboard</h1><p>Manage order status and payment status.</p></div><button id="logoutButton" class="outline-button">Log out</button></div><div class="stats"><div><small>Total orders</small><strong id="totalOrders">0</strong></div><div><small>Needs action</small><strong id="needsAction">0</strong></div><div><small>COD orders</small><strong id="codOrders">0</strong></div><div><small>Paid orders</small><strong id="paidOrders">0</strong></div></div><div class="table-tools"><input id="orderSearch" placeholder="Search order, customer, phone…"><button id="refreshButton" class="outline-button">Refresh</button></div><div id="ordersList" class="orders-list"></div><p id="dashboardError" class="error"></p></section></main><script src="/admin.js"></script></body></html>
